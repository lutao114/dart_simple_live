name: Android Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.0
          channel: stable
          cache: true

      - name: 创建空签名配置
        working-directory: ./simple_live_app/android
        run: |
          echo "storePassword=" > key.properties
          echo "keyPassword=" >> key.properties
          echo "keyAlias=" >> key.properties
          echo "storeFile=" >> key.properties

      # 动态注入dependency_overrides，临时强制intl版本，不修改仓库源码
      - name: 注入intl版本覆盖
        working-directory: ./simple_live_app
        run: |
          cat >> pubspec.yaml <<'EOF'

dependency_overrides:
  intl: ^0.20.2
EOF

      - name: 安装依赖
        working-directory: ./simple_live_app
        run: flutter pub get

      - name: 编译安卓正式包
        working-directory: ./simple_live_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-APK
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
